name: R071 reproducibility

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m compileall -q module1 module2 module3 module4 module5 data analysis scripts
      - run: python analysis/run_source_audit.py
      - run: python -m pytest -q tests/test_r071_smoke.py
