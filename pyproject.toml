[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "neurmito-dt-r071"
version = "0.1.1"
description = "Reproducibility materials for the NeurMito-DT R071 submission"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "slow: longer-running numerical validation tests",
]
